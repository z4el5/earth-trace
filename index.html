<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EARTH//TRACE — The Planet Leaves Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   SISTEMA DE DISEÑO · paleta oficial del equipo
   Bosque Profundo #0B3D1F · Verde Selva #1B5E3B · Esmeralda #2E7D32
   Verde Natural #4CAF50 · Oliva Claro #8BC34A · Limón #C5E384
   Teal #00897B · Azul Tierra #006064 · Aqua #4DB6AC · Cielo #B2EBF2
   Crema #F4F9E6 · Salvia #A7C957 · Militar #2F4F2F · Gris Verde #B0C9A5
   ========================================================= */
:root{
  --bg:#F4F9E6; --surface:#FBFDF5; --surface2:#EAF2D9; --ink:#0B3D1F; --muted:#3E5E3E; --line:#B0C9A5;
  --primary:#2E7D32; --on-primary:#F4F9E6; --accent:#C5E384; --on-accent:#0B3D1F;
  --teal:#00897B; --deep:#006064; --aqua:#4DB6AC;
  --ocean:#B2EBF2; --grat:#8FD3DD; --land:#DDE8CC; --land-line:#9DB592;
  --plat:#4CAF50; --plat-hi:#1B5E3B; --dim:#A7C957;
  --hero-bg:#0B3D1F; --hero-ink:#F4F9E6; --hero-muted:#B0C9A5;
  --shadow:0 1px 0 rgba(11,61,31,.06), 0 12px 28px -18px rgba(11,61,31,.45);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B3D1F; --surface:#124A2A; --surface2:#1B5E3B; --ink:#F4F9E6; --muted:#B0C9A5; --line:#2C6243;
    --primary:#8BC34A; --on-primary:#0B3D1F; --accent:#C5E384; --on-accent:#0B3D1F;
    --teal:#4DB6AC; --deep:#B2EBF2; --aqua:#4DB6AC;
    --ocean:#006064; --grat:#0A7176; --land:#1B5E3B; --land-line:#2E7D32;
    --plat:#8BC34A; --plat-hi:#C5E384; --dim:#4C7F3A;
    --hero-bg:#082E17; --hero-ink:#F4F9E6; --hero-muted:#B0C9A5;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 14px 32px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B3D1F; --surface:#124A2A; --surface2:#1B5E3B; --ink:#F4F9E6; --muted:#B0C9A5; --line:#2C6243;
  --primary:#8BC34A; --on-primary:#0B3D1F; --accent:#C5E384; --on-accent:#0B3D1F;
  --teal:#4DB6AC; --deep:#B2EBF2; --aqua:#4DB6AC;
  --ocean:#006064; --grat:#0A7176; --land:#1B5E3B; --land-line:#2E7D32;
  --plat:#8BC34A; --plat-hi:#C5E384; --dim:#4C7F3A;
  --hero-bg:#082E17; --hero-ink:#F4F9E6; --hero-muted:#B0C9A5;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 14px 32px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--teal); outline-offset:2px; border-radius:8px}
h1,h2,h3{font-family:var(--display); line-height:1.08; margin:0; letter-spacing:-.015em}
p{margin:0 0 .9em}
.wrap{max-width:1280px; margin:0 auto; padding-inline:clamp(16px,4vw,40px)}
.skip{position:absolute; left:-999px} .skip:focus{left:12px; top:12px; z-index:9; background:var(--surface); padding:8px 12px}

/* ---------- Encabezado ---------- */
header{background:var(--hero-bg); color:var(--hero-ink)}
.top{display:flex; align-items:center; gap:18px; padding-block:14px}
.logo{font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.02em; text-decoration:none; white-space:nowrap}
.logo span{color:#C5E384}
nav{flex:1; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{text-decoration:none; padding:8px 12px; border-radius:999px; font-size:15px; white-space:nowrap; color:var(--hero-muted)}
nav a:hover{color:var(--hero-ink); background:rgba(244,249,230,.08)}
nav a[aria-current="page"]{background:#C5E384; color:#0B3D1F; font-weight:700}
.tools{display:flex; gap:6px}
.tools button{background:transparent; border:1px solid rgba(176,201,165,.4); color:var(--hero-ink); border-radius:10px; padding:6px 11px; font-size:14px}
.tools button:hover{background:rgba(244,249,230,.08)}
@media (max-width:860px){
  .top{flex-wrap:wrap}
  nav{order:3; flex-basis:100%; margin-inline:-6px}
}

/* ---------- Hero ---------- */
.hero{background:var(--hero-bg); color:var(--hero-ink); padding-bottom:clamp(28px,5vw,56px); overflow:hidden}
.hero-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:clamp(16px,4vw,48px); align-items:center; padding-top:clamp(16px,4vw,40px)}
.hero h1{font-size:clamp(38px,6vw,76px); font-weight:800; letter-spacing:-.035em; max-width:12ch}
.hero h1 .l2{display:block; color:#C5E384}
.hero .lede{font-size:clamp(17px,1.6vw,20px); color:var(--hero-muted); max-width:44ch; margin:18px 0 26px}
.cta{display:flex; gap:10px; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; gap:8px; border:none; border-radius:14px; padding:13px 20px; font-weight:700; font-size:16px; text-decoration:none}
.btn.lime{background:#C5E384; color:#0B3D1F}
.btn.lime:hover{background:#D4EC9C}
.btn.line{background:transparent; color:#F4F9E6; border:1.5px solid rgba(176,201,165,.6)}
.btn.line:hover{border-color:#F4F9E6}
.btn.solid{background:var(--primary); color:var(--on-primary)}
.counts{display:flex; gap:28px; margin-top:30px; flex-wrap:wrap}
.counts div{font-size:14px; color:var(--hero-muted)}
.counts b{display:block; font-family:var(--display); font-size:30px; color:var(--hero-ink); font-variant-numeric:tabular-nums}

/* ---------- Globo ---------- */
.globe-box{position:relative}
.globe{width:100%; max-width:640px; aspect-ratio:1/1; margin:0 auto; position:relative; touch-action:none}
.globe svg{width:100%; height:100%; display:block; cursor:grab}
.globe svg:active{cursor:grabbing}
.sphere{fill:#006064}
.halo{fill:none; stroke:#4DB6AC; stroke-opacity:.35; stroke-width:10}
.grat{fill:none; stroke:#0A7176; stroke-width:.5}
.cty{fill:#1B5E3B; stroke:#0B3D1F; stroke-width:.35}
.cty.plat{fill:#8BC34A; stroke:#2E7D32; cursor:pointer}
.cty.plat:hover,.cty.plat.sel{fill:#C5E384}
.cty.plat.off{fill:#4C7F3A}
.isle{fill:#C5E384; stroke:#0B3D1F; stroke-width:1; cursor:pointer}
.isle.off{fill:#4C7F3A}
.tip{position:absolute; pointer-events:none; background:#F4F9E6; color:#0B3D1F; border-radius:10px; padding:6px 10px; font-size:14px; font-weight:700; box-shadow:0 6px 18px -8px rgba(0,0,0,.6); transform:translate(-50%,-130%); white-space:nowrap}
.conts{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:10px}
.conts button{background:transparent; color:var(--hero-muted); border:1px solid rgba(176,201,165,.35); border-radius:999px; padding:6px 12px; font-size:14px}
.conts button:hover{color:var(--hero-ink)}
.conts button[aria-pressed="true"]{background:#4DB6AC; color:#0B3D1F; border-color:#4DB6AC; font-weight:700}
.card-c{margin:14px auto 0; max-width:520px; background:rgba(244,249,230,.06); border:1px solid rgba(176,201,165,.3); border-radius:16px; padding:14px 16px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center}
.card-c .flag{font-size:38px; grid-row:span 2; line-height:1}
.card-c b{font-family:var(--display); font-size:20px}
.card-c small{color:var(--hero-muted)}
.card-c .st{grid-column:1/-1; font-size:14px; color:var(--hero-muted); border-top:1px solid rgba(176,201,165,.2); padding-top:8px; margin-top:6px}
.card-c .st i{font-style:normal; color:#C5E384; font-weight:700}

/* ---------- Secciones de la página ---------- */
section.block{padding-block:clamp(44px,7vw,88px)}
.block h2{font-size:clamp(28px,3.6vw,44px); font-weight:800; margin-bottom:12px; max-width:20ch}
.block .intro{color:var(--muted); max-width:58ch; font-size:18px}
.journey{list-style:none; padding:0; margin:34px 0 0; display:grid; grid-template-columns:repeat(5,1fr); gap:14px; counter-reset:j}
.journey li{position:relative}
.journey a{display:flex; flex-direction:column; height:100%; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s}
.journey a:hover{transform:translateY(-2px); border-color:var(--primary)}
.journey .n{font-family:var(--display); font-weight:800; font-size:15px; color:var(--teal)}
.journey h3{font-size:21px; margin:6px 0 2px}
.journey .es{font-size:14px; color:var(--muted); margin-bottom:10px}
.journey p{font-size:15px; margin:0 0 12px; flex:1}
.journey .ico{width:44px; height:44px; border-radius:12px; background:var(--surface2); display:grid; place-items:center; margin-bottom:12px}
.journey .ico svg{width:26px; height:26px; stroke:var(--primary); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.journey .go{font-size:14px; font-weight:700; color:var(--primary)}
.flowline{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:22px; font-size:15px; color:var(--muted)}
.flowline b{color:var(--ink)}

.sources{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; margin-top:30px}
.src-col{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px}
.src-col h3{font-size:20px; margin-bottom:12px; display:flex; align-items:center; gap:8px}
.src-col h3 .dot{width:10px; height:10px; border-radius:50%; background:var(--primary)}
.src-col.comp h3 .dot{background:var(--teal)}
.src-col ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.src-col li{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding-bottom:10px; border-bottom:1px dashed var(--line)}
.src-col li:last-child{border-bottom:none; padding-bottom:0}
.src-col li b{font-family:var(--display)}
.src-col li small{grid-column:1/-1; color:var(--muted); font-size:14px}
.org{font-size:12px; font-weight:700; border-radius:6px; padding:2px 8px; background:var(--surface2); color:var(--ink); align-self:start}
.note{margin-top:14px; font-size:15px; color:var(--muted); border-left:4px solid var(--accent); padding-left:12px; max-width:70ch}

.atlas{margin-top:28px; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.atlas details{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:0}
.atlas summary{cursor:pointer; list-style:none; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; font-family:var(--display); font-weight:700; font-size:18px}
.atlas summary::-webkit-details-marker{display:none}
.atlas summary span{font-family:var(--body); font-weight:700; font-size:14px; background:var(--accent); color:var(--on-accent); border-radius:999px; padding:1px 10px}
.atlas ul{list-style:none; margin:0; padding:0 16px 14px; display:grid; gap:4px; font-size:15px}
.atlas li{display:flex; gap:8px}

/* ---------- Páginas de sección (en construcción) ---------- */
.page-head{background:var(--hero-bg); color:var(--hero-ink); padding-block:clamp(34px,6vw,70px)}
.page-head .n{font-family:var(--display); font-weight:800; color:#4DB6AC}
.page-head h1{font-size:clamp(36px,5.5vw,64px); font-weight:800; letter-spacing:-.03em; margin:6px 0 10px}
.page-head p{color:var(--hero-muted); max-width:56ch; font-size:19px}
.plan{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.plan > div{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px}
.plan h3{font-size:20px; margin-bottom:10px}
.plan ul{margin:0; padding-left:20px}
.plan li{margin-bottom:6px}
.status{display:inline-flex; gap:8px; align-items:center; background:var(--surface2); border-radius:999px; padding:6px 14px; font-weight:700; font-size:15px; margin-bottom:22px}
.status::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--teal)}

/* ---------- Earth Explorer ---------- */
.conttabs{display:flex; gap:6px; flex-wrap:wrap; margin-top:18px}
.conttabs button{border:1px solid rgba(176,201,165,.35); background:transparent; color:var(--hero-muted); border-radius:999px; padding:7px 14px; font-size:14px}
.conttabs button[aria-pressed="true"]{background:#C5E384; color:#0B3D1F; border-color:#C5E384; font-weight:700}
.conttabs button[disabled]{opacity:.5; cursor:not-allowed}
.conttabs small{opacity:.8}
.ex-grid{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:clamp(16px,3vw,32px); align-items:start}
.mapcard{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:14px; box-shadow:var(--shadow); position:relative}
.mapcard svg{width:100%; height:auto; display:block; border-radius:14px}
.eu-sea{fill:var(--ocean)}
.eu-grat{fill:none; stroke:var(--grat); stroke-width:.5}
.eu-c{fill:var(--land); stroke:var(--land-line); stroke-width:.5}
.eu-c.p{stroke:var(--ink); stroke-width:.7; cursor:pointer; transition:opacity .15s}
.eu-c.p.dim{opacity:.22}
.eu-c.p.sel{stroke-width:2.4}
.eu-c.p:hover{opacity:.85}
.maptip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); border-radius:10px; padding:6px 10px; font-size:14px; font-weight:700; transform:translate(-50%,-130%); white-space:nowrap}
.legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.legend button{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 11px; font-size:14px}
.legend button[aria-pressed="true"]{border-color:var(--ink); background:var(--surface2); font-weight:700}
.legend i{width:12px; height:12px; border-radius:4px; border:1px solid rgba(11,61,31,.35)}
.legend b{font-variant-numeric:tabular-nums; color:var(--muted); font-weight:700}
.profile{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:clamp(18px,2.6vw,28px); box-shadow:var(--shadow); min-height:300px}
.profile .ph-head{display:flex; gap:14px; align-items:center; margin-bottom:6px}
.profile .fl{font-size:48px; line-height:1}
.profile h2{font-size:clamp(28px,3vw,38px); font-weight:800}
.profile .sub{color:var(--muted); font-size:15px}
.cat{display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:700; border-radius:999px; padding:4px 11px; background:var(--surface2); margin:8px 0 14px}
.cat i{width:10px; height:10px; border-radius:50%}
.profile h3{font-size:18px; margin:18px 0 8px}
.profile ul.ph{margin:0; padding-left:20px}
.profile ul.ph li{margin-bottom:6px}
.rq{border-left:5px solid var(--primary); background:var(--surface2); border-radius:0 14px 14px 0; padding:12px 16px; font-family:var(--display); font-weight:700; font-size:19px; line-height:1.3}
.rq small{display:block; font-family:var(--body); font-weight:400; font-size:13px; color:var(--muted); margin-bottom:4px}
.offsrc{border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:grid; gap:6px}
.offsrc b{font-family:var(--display); font-size:17px}
.offsrc .role{font-size:14px; color:var(--muted)}
.offsrc .warn{font-size:14px; border-left:3px solid var(--accent); padding-left:10px}
.linkbtn{display:inline-flex; align-items:center; gap:8px; justify-self:start; border:1.5px solid var(--primary); color:var(--primary); border-radius:12px; padding:8px 14px; font-weight:700; font-size:15px; text-decoration:none}
.linkbtn:hover{background:var(--surface2)}
.linkbtn.fill{background:var(--primary); color:var(--on-primary)}
.ds{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.ds li{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 12px; border-radius:12px; background:var(--surface2)}
.ds b{font-family:var(--display)}
.ds small{grid-column:1/-1; color:var(--muted); font-size:14px}
.checks{list-style:none; padding:0; margin:0; display:grid; gap:6px; font-size:15px}
.checks li{display:flex; gap:10px; align-items:center}
.checks .k{width:22px; height:22px; border-radius:7px; display:grid; place-items:center; font-size:13px; font-weight:800; flex:none}
.checks .done .k{background:var(--primary); color:var(--on-primary)}
.checks .todo .k{border:2px dashed var(--muted); color:var(--muted)}
.empty{display:grid; place-items:center; text-align:center; min-height:300px; color:var(--muted)}
.empty b{display:block; font-family:var(--display); font-size:22px; color:var(--ink); margin-bottom:6px}
.ctools{display:flex; justify-content:space-between; align-items:end; gap:14px; flex-wrap:wrap; margin:34px 0 14px}
.ctools h2{font-size:clamp(24px,3vw,34px); font-weight:800}
.search{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; padding:10px 14px; font:inherit; font-size:16px; min-width:min(280px,100%)}
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; list-style:none; padding:0; margin:0}
.cgrid button{width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; display:grid; grid-template-columns:auto 1fr; gap:2px 12px; align-items:center}
.cgrid button:hover{border-color:var(--primary)}
.cgrid button[aria-current="true"]{border:2px solid var(--primary); background:var(--surface2)}
.cgrid .f{font-size:30px; grid-row:span 2}
.cgrid b{font-family:var(--display); font-size:17px}
.cgrid small{color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px}
.cgrid small i{width:8px; height:8px; border-radius:50%; flex:none}
.method{margin-top:34px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.method div{border-top:4px solid var(--primary); padding-top:10px}
.method b{font-family:var(--display); font-size:18px; display:block; margin-bottom:4px}
.method p{font-size:15px; color:var(--muted); margin:0}
@media (max-width:960px){ .ex-grid{grid-template-columns:1fr} .method{grid-template-columns:1fr} }
/* ---------- Pregúntale a la Tierra ---------- */
.ask{background:var(--surface); border:1.5px solid var(--primary); border-radius:22px; padding:clamp(16px,2.4vw,24px); box-shadow:var(--shadow); margin-bottom:22px}
.ask h2{font-size:clamp(22px,2.6vw,30px); font-weight:800; margin-bottom:4px}
.ask .sub{color:var(--muted); font-size:15px; margin-bottom:12px}
.askrow{display:flex; gap:8px}
.askrow input{flex:1; min-width:0; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:14px; padding:13px 16px; font:inherit; font-size:17px}
.askrow input:focus{border-color:var(--primary); outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.chips button{border:1px solid var(--line); background:var(--surface2); border-radius:999px; padding:6px 12px; font-size:14px; text-align:left}
.chips button:hover{border-color:var(--primary)}
.answer{margin-top:14px; border-top:1px dashed var(--line); padding-top:14px}
.answer .qq{font-family:var(--display); font-weight:700; font-size:17px; margin-bottom:6px}
.answer .txt{white-space:pre-wrap; font-size:16.5px}
.answer .txt.wait{color:var(--muted)}
.answer .by{margin-top:10px; font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.answer .by span{border-radius:6px; padding:2px 8px; font-weight:700; background:var(--surface2); color:var(--ink)}
.answer .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.mini-btn{border:1.5px solid var(--primary); color:var(--primary); background:transparent; border-radius:10px; padding:6px 12px; font-weight:700; font-size:14px}
/* ---------- Visor satelital ---------- */

/* ---------- HUD de juego ---------- */

#toasts{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:grid; gap:8px; z-index:50; pointer-events:none}

.filebtn{display:inline-flex; justify-content:center; gap:8px; border:1.5px dashed var(--primary); color:var(--primary); border-radius:12px; padding:10px; font-weight:700; cursor:pointer}
.filebtn input{position:absolute; width:1px; height:1px; opacity:0}
.filebtn:focus-within{outline:3px solid var(--teal)}
.slot textarea{width:100%; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:13px ui-monospace,monospace; padding:8px; margin:6px 0}
.slot summary{cursor:pointer; color:var(--muted); font-size:14px}
.slot-s{font-size:14px}
.labbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:20px 0 10px}
.labbar .lbl2{margin:0}
.labbar select{min-width:0}
.labres{display:grid; gap:14px} .labres.two{grid-template-columns:1fr 1fr}
.labcard{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px}
.warns{list-style:none; padding:0; margin:12px 0 0; display:grid; gap:4px; font-size:14px; color:var(--muted)}
/* archivo */
.cfgrid{display:grid; grid-template-columns:minmax(240px,.7fr) minmax(0,1.6fr); gap:18px; align-items:start}
.cflist{list-style:none; margin:0; padding:6px; display:grid; gap:4px; max-height:640px; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:18px}
.cflist button{width:100%; text-align:left; display:grid; grid-template-columns:auto 1fr; gap:0 10px; align-items:center; background:transparent; border:none; border-radius:12px; padding:9px 10px}
.cflist button span{grid-row:span 2; font-size:22px}
.cflist button b{font-family:var(--display); font-size:15.5px} .cflist button small{color:var(--muted); font-size:13px}
.cflist button:hover{background:var(--surface2)}
.cflist button[aria-current="true"]{background:var(--surface2); box-shadow:inset 3px 0 0 var(--primary)}
.cflist button.lock{opacity:.6}
/* descubrimiento */
.dx{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(16px,3vw,32px); align-items:start}
.dx-txt h2{font-size:clamp(26px,3vw,36px); font-weight:800; margin-bottom:10px}
.dx-txt p{font-size:18px}
.dx-play{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; display:grid; gap:10px; box-shadow:var(--shadow)}
.dx-play svg{width:100%; height:auto; border-radius:14px; background:var(--ocean)}
.lake{fill:var(--teal); fill-opacity:.85; stroke:#B2EBF2; stroke-width:2}
.lk-y{font-family:var(--display); font-weight:800; font-size:24px; fill:var(--ink)}
.sat-i{font-size:26px}
.beam{stroke:#C5E384; stroke-width:2; stroke-dasharray:4 4}
.leaf{width:120px; height:120px; border-radius:50%; display:grid; place-items:center; font-size:56px; margin:0 auto; transition:background .3s; border:4px solid var(--line)}
.ndvi{text-align:center; font-family:ui-monospace,monospace; font-size:14px} .ndvi b{font-size:22px; font-family:var(--display)} .ndvi span{display:block; font-family:var(--body); font-size:15px; margin-top:4px}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.duo button{background:var(--surface2); border:2px solid var(--line); border-radius:14px; padding:8px; text-align:left}
.duo button.right{border-color:var(--primary)} .duo button.wrong{border-color:var(--warn)}
.score{font-family:var(--display); font-weight:800; font-size:20px}
@media (max-width:960px){ .ggrid,.dx,.cfgrid,.slots,.labres.two,.gcases{grid-template-columns:1fr} .steps li span{display:none} .stats{grid-template-columns:1fr 1fr} .labsteps{grid-template-columns:1fr} }
@media (max-width:520px){ .pair,.duo{grid-template-columns:1fr} }
.guide{display:grid; grid-template-columns:260px minmax(0,1fr); gap:clamp(18px,3vw,40px); align-items:start}
.toc{position:sticky; top:16px; display:grid; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px}
.toc b{font-family:var(--display); margin-bottom:6px}
.toc a{text-decoration:none; padding:7px 10px; border-radius:10px; font-size:15px}
.toc a:hover{background:var(--surface2)}
.gsec{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:clamp(18px,2.6vw,28px); margin-bottom:16px; scroll-margin-top:16px}
.gsec h2{font-size:clamp(22px,2.6vw,30px); font-weight:800; margin-bottom:8px}
.gsec .intro{font-size:17px; margin-bottom:12px}
.gsteps{margin:0; padding:0; list-style:none; counter-reset:g; display:grid; gap:10px}
.gsteps li{counter-increment:g; display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start; font-size:16.5px}
.gsteps li::before{content:counter(g); width:30px; height:30px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:15px}
.gloss{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin:0}
.gloss div{background:var(--surface2); border-radius:14px; padding:12px 14px}
.gloss dt{font-family:var(--display); font-weight:700} .gloss dd{margin:2px 0 0; font-size:15px}
.faq{border-top:1px solid var(--line); padding:12px 0}
.faq summary{cursor:pointer; font-weight:700; font-family:var(--display); font-size:17px}
.faq p{margin:8px 0 0}
dialog.welcome{border:none; border-radius:24px; padding:clamp(20px,3vw,32px); max-width:620px; width:calc(100% - 32px); background:var(--surface); color:var(--ink); box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog.welcome::backdrop{background:rgba(8,46,23,.7)}
dialog.welcome h2{font-size:clamp(26px,3vw,34px); font-weight:800; margin-bottom:6px}
.wsteps{list-style:none; padding:0; margin:16px 0 20px; display:grid; gap:10px}
.wsteps li{display:grid; grid-template-columns:auto 1fr; gap:2px 12px; align-items:center; background:var(--surface2); border-radius:14px; padding:12px}
.wsteps span{grid-row:span 2; font-size:28px} .wsteps b{font-family:var(--display)} .wsteps small{color:var(--muted); font-size:14px}
@media (max-width:860px){ .guide{grid-template-columns:1fr} .toc{position:static} }

footer{background:var(--hero-bg); color:var(--hero-muted); padding-block:34px; font-size:15px}
footer .row{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap}
footer b{color:var(--hero-ink); font-family:var(--display)}

@media (max-width:1050px){ .journey{grid-template-columns:repeat(2,1fr)} .journey li:last-child{grid-column:1/-1} }
@media (max-width:860px){ .hero-grid,.sources,.plan{grid-template-columns:1fr} .hero h1{max-width:none} }
@media (max-width:520px){ .journey{grid-template-columns:1fr} .counts{gap:18px} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

const features=topojson.feature(WORLD,WORLD.objects.countries).features;
const byMap=new Map(COUNTRIES.map(c=>[c.m,c]));
features.forEach(f=>{f.c=byMap.get(f.properties.n)||null;});
// países muy pequeños: se muestran como punto para que se puedan tocar
const ISLES=[];
COUNTRIES.forEach(c=>{
  const f=features.find(x=>x.c===c);
  if(!f) ISLES.push({c,lonlat:[179.2,-8.5]}); // Tuvalu
  else if(d3.geoArea(f)<4e-5) ISLES.push({c,lonlat:d3.geoCentroid(f)});
});
const inCont=(c,k)=>k==="all"||c.c===k||c.also===k;

    el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    applyFilter();
    if(contFilter!=="all")spinTo(CONT[contFilter].c);
  });

let G=null;
function buildGlobe(){
  const box=document.getElementById("globe"), svg=d3.select(box).select("svg"), tip=document.getElementById("tip");
  const S=600; svg.attr("viewBox",`0 0 ${S} ${S}`);
  const proj=d3.geoOrthographic().translate([S/2,S/2]).scale(280).rotate([72,-15]).clipAngle(90).precision(.4);
  const path=d3.geoPath(proj);
  svg.append("circle").attr("class","halo").attr("cx",S/2).attr("cy",S/2).attr("r",285);
  svg.append("path").datum({type:"Sphere"}).attr("class","sphere");
  svg.append("path").datum(d3.geoGraticule10()).attr("class","grat");
  const cty=svg.append("g").selectAll("path").data(features).join("path")
    .attr("class",d=>"cty"+(d.c?" plat":""));
  const isles=svg.append("g").selectAll("circle").data(ISLES).join("circle").attr("class","isle").attr("r",4.5);
  const showTip=(e,c)=>{const r=box.getBoundingClientRect();tip.hidden=false;
    tip.textContent=`${flag(c.i)} ${nameOf(c)}`;tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";};
  cty.filter(d=>d.c).on("pointermove",(e,d)=>showTip(e,d.c)).on("pointerleave",()=>tip.hidden=true).on("click",(e,d)=>select(d.c));
  isles.on("pointermove",(e,d)=>showTip(e,d.c)).on("pointerleave",()=>tip.hidden=true).on("click",(e,d)=>select(d.c));
  function redraw(){
    svg.selectAll("path.sphere,path.grat").attr("d",path); cty.attr("d",path);
    const ctr=[-proj.rotate()[0],-proj.rotate()[1]];
    isles.each(function(d){const vis=d3.geoDistance(d.lonlat,ctr)<1.5;const p=proj(d.lonlat);
      d3.select(this).attr("cx",p[0]).attr("cy",p[1]).style("display",vis?null:"none");});
  }
  let dragging=false,r0,p0;
  svg.call(d3.drag()
    .on("start",e=>{dragging=true;stopSpin();r0=proj.rotate();p0=[e.x,e.y];tip.hidden=true;})
    .on("drag",e=>{const k=70/proj.scale();proj.rotate([r0[0]+(e.x-p0[0])*k,Math.max(-80,Math.min(80,r0[1]-(e.y-p0[1])*k))]);redraw();})
    .on("end",()=>{dragging=false;}));
  G={proj,redraw,cty,isles};
  redraw(); applyFilter();
  if(!reduced) startSpin();
}
function startSpin(){ if(globeTimer)return; globeTimer=d3.timer(()=>{const r=G.proj.rotate();G.proj.rotate([r[0]+.1,r[1]]);G.redraw();}); }
function stopSpin(){ if(globeTimer){globeTimer.stop();globeTimer=null;} }
function spinTo(lonlat){
  stopSpin();
  const from=G.proj.rotate(), to=[-lonlat[0],-lonlat[1]];
  if(reduced){G.proj.rotate(to);G.redraw();return;}
  const i=d3.interpolate(from,to);
  d3.transition().duration(1100).ease(d3.easeCubicInOut).tween("rot",()=>tt=>{G.proj.rotate(i(tt));G.redraw();});
}
function applyFilter(){
  if(!G)return;
  G.cty.classed("off",d=>d.c&&!inCont(d.c,contFilter)).classed("sel",d=>d.c&&d.c===selected);
  G.isles.classed("off",d=>!inCont(d.c,contFilter));
}
function select(c){
  selected=c; applyFilter(); showCard();
  const f=features.find(x=>x.c===c); spinTo(f?d3.geoCentroid(f):ISLES.find(x=>x.c===c).lonlat);
}
function showCard(){
  const el=document.getElementById("ccard"); if(!el)return;
  if(!selected){el.innerHTML="";el.insertAdjacentHTML("beforeend",`<p style="text-align:center;color:var(--hero-muted);font-size:14px;margin-top:10px">${t("drag")}</p>`);return;}

    <b>${nameOf(c)}</b><small>${CONT[c.c][LANG]}${c.also?" · "+CONT[c.also][LANG]:""} · ${t("inPlat")}</small>
    ${DATA[c.i]?`<div class="st"><i>●</i> ${DATA[c.i].inst} · ${CATS[DATA[c.i].cat][LANG]}<br><a href="#explorer-${c.i.toLowerCase()}" style="color:#C5E384;font-weight:700">${t("cardMore")}</a></div>`
      :`<div class="st"><i>●</i> ${t("stInv")}</div>`}</div>`;
}

const blank=()=>({xp:0,visited:[],sat:[],asked:0,saved:[],badges:[],missions:[],dev:false,cases:[],labs:[],disc:[],labRuns:0});

function saveST(){try{localStorage.setItem("earthtrace-progress",JSON.stringify(ST));}catch(e){}}
const rankOf=xp=>RANKS.filter(r=>xp>=r.xp).pop();
const nextRank=xp=>RANKS.find(r=>r.xp>xp)||null;
function addXP(n,why){
  const before=rankOf(ST.xp); ST.xp+=n; const after=rankOf(ST.xp);
  toast(`+${n} XP`,why);
  if(after!==before)setTimeout(()=>toast(`${after.ico} ${t("rankUp")}`,after[LANG],"big"),700);
}
function checkProgress(){
  BADGES.forEach(b=>{if(!ST.badges.includes(b.id)&&b.ok(ST)){ST.badges.push(b.id);setTimeout(()=>{toast(`${b.ico} ${t("badgeNew")}`,b[LANG],"big");ST.xp+=25;saveST();drawHUD();},400);}});
  MISSIONS.forEach(m=>{const [a,z]=m.prog(ST);if(!ST.missions.includes(m.id)&&a>=z){ST.missions.push(m.id);setTimeout(()=>addXP(m.xp,`${t("missionDone")}: ${m[LANG]}`),900);}});
  saveST(); drawHUD();
}
function track(kind,arg){
  if(kind==="visit"&&!ST.visited.includes(arg)){
    const cont=COUNTRIES.find(c=>c.i===arg).c, newRegion=!COUNTRIES.some(c=>c.c===cont&&ST.visited.includes(c.i));
    ST.visited.push(arg); addXP(10,`${t("stamp")} ${flag(arg)}`); if(newRegion)setTimeout(()=>addXP(20,`${t("newRegion")}: ${CONT[cont][LANG]}`),500);
  }
  if(kind==="sat"&&!ST.sat.includes(arg)){ST.sat.push(arg);addXP(15,t("satXP"));}
  if(kind==="ask"){ST.asked++;addXP(5,t("askXP"));}
  if(kind==="save"&&!ST.saved.includes(arg)){ST.saved.push(arg);addXP(5,t("saveXP"));}
  if(kind==="dev"&&!ST.dev){ST.dev=true;addXP(10,t("devXP"));}
  checkProgress();
}
function drawHUD(){
  const el=document.getElementById("hud"); if(!el)return;
  const r=rankOf(ST.xp), n=nextRank(ST.xp);
  const pct=n?Math.round(100*(ST.xp-r.xp)/(n.xp-r.xp)):100;
  el.innerHTML=`<span class="hud-ico" aria-hidden="true">${r.ico}</span><span class="hud-txt"><b>${r[LANG]}</b><span class="xpbar"><i style="width:${pct}%"></i></span></span><span class="hud-xp">${ST.xp} XP</span>`;
  el.setAttribute("aria-label",`${r[LANG]}, ${ST.xp} XP. ${t("myBase")}`);
}
function toast(title,sub,kind){
  let box=document.getElementById("toasts");
  if(!box){box=document.createElement("div");box.id="toasts";box.setAttribute("aria-live","polite");document.body.appendChild(box);}
  const el=document.createElement("div"); el.className="toast"+(kind?" "+kind:"");
  el.innerHTML=`<b>${title}</b>${sub?`<span>${sub}</span>`:""}`;
  box.appendChild(el); setTimeout(()=>el.classList.add("out"),2600); setTimeout(()=>el.remove(),3100);
}

const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u;}};
function wvBox(c){
  if(c.i==="RU") return [27,41,180,78];
  if(c.i==="US") return [-125,24,-66,50];
  if(c.i==="KI") return [172,-3,177,3.5];
  const f=features.find(x=>x.c===c);
  if(!f){const s=ISLES.find(x=>x.c===c);const [x,y]=s.lonlat;return [x-1.2,y-1,x+1.2,y+1];}
  const polys=f.geometry.type==="MultiPolygon"?f.geometry.coordinates.map(p=>({type:"Polygon",coordinates:p})):[f.geometry];
  const big=polys.reduce((a,b)=>d3.geoArea(b)>d3.geoArea(a)?b:a);
  const [[x0,y0],[x1,y1]]=d3.geoBounds(big);
  const keep=polys.filter(p=>{const [cx,cy]=d3.geoCentroid(p);return cx>x0-3&&cx<x1+3&&cy>y0-3&&cy<y1+3;});
  const b=d3.geoBounds({type:"FeatureCollection",features:keep.map(g=>({type:"Feature",geometry:g}))});
  const pad=Math.max(.4,Math.min(1.2,(b[1][0]-b[0][0])*.06));
  return [b[0][0]-pad,b[0][1]-pad,b[1][0]+pad,b[1][1]+pad].map(v=>+v.toFixed(2));
}

function drawLegend(){

}
let RM=null;
function drawRegion(){
  const W=640,H=520, svg=d3.select("#regmap").attr("viewBox",`0 0 ${W} ${H}`), tip=document.getElementById("regtip");
  const ctr=CONT[exCont].c;
  const proj=d3.geoAzimuthalEqualArea().rotate([-ctr[0],-ctr[1]]).clipAngle(100);
  let fitObj;
  if(exCont==="europe") fitObj={type:"MultiPoint",coordinates:[[-24,35],[44,35],[-10,71],[40,71],[30,34],[-25,63]]};
  else{
    const fs=regionList(exCont).filter(c=>c.i!=="RU"&&c.i!=="TR"&&c.i!=="US").map(c=>features.find(f=>f.c===c)).filter(Boolean);
    const pts=regionList(exCont).map(c=>{const s=ISLES.find(x=>x.c===c);return s?s.lonlat:null;}).filter(Boolean);
    if(exCont==="north") pts.push([-168,72],[-52,50],[-117,15],[-80,25]);
    fitObj={type:"GeometryCollection",geometries:fs.map(f=>f.geometry).concat(pts.length?[{type:"MultiPoint",coordinates:pts}]:[])};
  }
  proj.fitExtent([[18,18],[W-18,H-18]],fitObj);
  const path=d3.geoPath(proj);
  svg.selectAll("*").remove();
  svg.append("rect").attr("class","eu-sea").attr("width",W).attr("height",H);
  svg.append("path").datum(d3.geoGraticule().step([10,10])()).attr("class","eu-grat").attr("d",path);
  const vis=features.filter(f=>{const b=path.bounds(f);return isFinite(b[0][0])&&b[1][0]>0&&b[0][0]<W&&b[1][1]>0&&b[0][1]<H;});
  svg.append("g").selectAll("path").data(vis.filter(f=>!(f.c&&inRegion(f.c,exCont)))).join("path").attr("class","eu-c").attr("d",path);
  const P=svg.append("g").selectAll("path").data(vis.filter(f=>f.c&&inRegion(f.c,exCont))).join("path")
    .attr("class","eu-c p").attr("d",path).attr("fill",d=>catOf(d.c).col).attr("tabindex",0).attr("role","button").attr("aria-label",d=>nameOf(d.c));
  const isl=svg.append("g").selectAll("g").data(ISLES.filter(s=>inRegion(s.c,exCont))).join("g").attr("class","isle-m").attr("tabindex",0).attr("role","button")
    .attr("aria-label",d=>nameOf(d.c)).attr("transform",d=>{const p=proj(d.lonlat);return `translate(${p[0]},${p[1]})`;});
  isl.append("circle").attr("r",11).attr("class","isle-ring");
  isl.append("circle").attr("r",6).attr("fill",d=>catOf(d.c).col).attr("class","isle-dot");
  const box=document.querySelector(".mapcard");
  const on=sel=>sel.on("pointermove",(e,d)=>{const r=box.getBoundingClientRect();tip.hidden=false;
      tip.textContent=`${flag(d.c.i)} ${nameOf(d.c)} · ${catOf(d.c)[LANG]}${ST.visited.includes(d.c.i)?" · ✓":""}`;tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";})
    .on("pointerleave",()=>tip.hidden=true).on("click",(e,d)=>pickC(d.c))
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pickC(d.c);}});
  on(P); on(isl);
  RM={P,isl}; updateRegion();
}
function updateRegion(){
  if(!RM)return;
  const dim=c=>exCat!=="all"&&DATA[c.i].cat!==exCat;
  RM.P.classed("dim",d=>dim(d.c)).classed("sel",d=>exSel&&d.c===exSel).classed("seen",d=>ST.visited.includes(d.c.i));
  RM.isl.classed("dim",d=>dim(d.c)).classed("sel",d=>exSel&&d.c===exSel);
  RM.P.filter(d=>exSel&&d.c===exSel).raise();
}
function pickC(c){
  if(c.c!==exCont&&!(c.also===exCont)){exSel=c;exCont=c.c;history.replaceState(null,"","#explorer-"+c.i.toLowerCase());renderExplorer();return;}
  exSel=c; history.replaceState(null,"","#explorer-"+c.i.toLowerCase());
  updateRegion(); drawList(); drawProfile(); track("visit",c.i); updateRegion();
  if(window.innerWidth<960)document.getElementById("profile").scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"});
}
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"");

/* ---------- Visor satelital (NASA GIBS) ---------- */
const LAYERS={
  true:{es:"Color real",en:"True color",id:"MODIS_Terra_CorrectedReflectance_TrueColor",fmt:"image/jpeg",what:{es:"Imagen MODIS (Terra) como la vería el ojo humano.",en:"MODIS (Terra) image as the human eye would see it."}},
  lst:{es:"Temperatura",en:"Temperature",id:"MODIS_Terra_Land_Surface_Temp_Day",over:true,what:{es:"Temperatura de la superficie terrestre de día (MODIS).",en:"Daytime land surface temperature (MODIS)."}},
  ndvi:{es:"Vegetación",en:"Vegetation",id:"MODIS_Terra_NDVI_8Day",over:true,what:{es:"Índice de vegetación NDVI de 8 días (MODIS).",en:"8-day NDVI vegetation index (MODIS)."}},
  snow:{es:"Nieve",en:"Snow",id:"MODIS_Terra_L3_Snow_Extent_8Day",over:true,what:{es:"Extensión de nieve de 8 días (MODIS).",en:"8-day snow extent (MODIS)."}},
  fire:{es:"Incendios",en:"Fires",id:"MODIS_Terra_Thermal_Anomalies_All",over:true,base:true,what:{es:"Focos de calor detectados (MODIS) sobre color real.",en:"Detected thermal anomalies (MODIS) over true color."}}
};
const CAT_LAYER={ice:"snow",drought:"lst",fire:"fire",flood:"true",coast:"true",water:"true",forest:"ndvi"};
const CAT_MONTH={ice:"08-15",drought:"07-20",fire:"08-10",flood:"07-20",coast:"07-15",water:"07-15",forest:"07-15"};
function gibsUrl(layer,date,b,w=800,h=600){
  const L=LAYERS[layer];
  const ids=(L.base?["MODIS_Terra_CorrectedReflectance_TrueColor",L.id]:[L.id]).concat(L.over?["Coastlines_15m"]:[]);
  const p=new URLSearchParams({SERVICE:"WMS",REQUEST:"GetMap",VERSION:"1.3.0",LAYERS:ids.join(","),STYLES:"",CRS:"EPSG:4326",
    BBOX:[b[1],b[0],b[3],b[2]].join(","),WIDTH:w,HEIGHT:h,FORMAT:L.fmt||"image/png",TRANSPARENT:L.over&&!L.base?"TRUE":"FALSE",TIME:date});
  return "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?"+p.toString();
}
function wvUrl(layer,date,b){
  const L=LAYERS[layer];
  const l=[L.id,"Coastlines_15m"].concat(L.id.includes("TrueColor")?[]:["MODIS_Terra_CorrectedReflectance_TrueColor"]);
  return `https://worldview.earthdata.nasa.gov/?v=${b.join(",")}&l=${l.join(",")}&t=${date}`;
}
let satState={};
function satBox(c){let [x0,y0,x1,y1]=wvBox(c); const cx=(x0+x1)/2, cy=(y0+y1)/2;
  let w=x1-x0, h=y1-y0; const k=Math.cos(cy*Math.PI/180);
  if(w*k/h>4/3) h=w*k*3/4; else w=h*4/3/k;
  return [cx-w/2,cy-h/2,cx+w/2,cy+h/2].map(v=>+v.toFixed(3));}
function drawSat(c){
  const el=document.getElementById("satbox"); if(!el)return;
  const e=DATA[c.i]; const b=satBox(c);
  if(satState.for!==c.i){satState={layer:CAT_LAYER[e.cat],y1:2003,y2:2023,for:c.i};}
  const md=CAT_MONTH[e.cat], south=b[1]+b[3]<0, mm=south?md.replace(/^0[78]/,"01"):md;
  const d1=`${satState.y1}-${mm}`, d2=`${satState.y2}-${mm}`, L=LAYERS[satState.layer];
  el.innerHTML=`<div class="sat">
    <div class="sat-tabs" role="group" aria-label="${t("satLayer")}">${Object.entries(LAYERS).map(([k,v])=>`<button data-layer="${k}" aria-pressed="${k===satState.layer}">${v[LANG]}</button>`).join("")}</div>
    <div class="cmp" id="cmp" style="--cut:50%">
      <img class="before" alt="${nameOf(c)} ${d1}" src="${gibsUrl(satState.layer,d1,b)}">
      <img class="after" alt="${nameOf(c)} ${d2}" src="${gibsUrl(satState.layer,d2,b)}">
      <span class="bar"></span><span class="knob" aria-hidden="true">⇆</span>
      <span class="lbl l">${d1}</span><span class="lbl r">${d2}</span>
      <input type="range" min="0" max="100" value="50" aria-label="${t("satSlide")}">
    </div>
    <div class="sat-ctl">
      <label>${t("satBefore")}<input type="number" id="y1" min="2001" max="2025" value="${satState.y1}"></label>
      <label>${t("satAfter")}<input type="number" id="y2" min="2001" max="2025" value="${satState.y2}"></label>
      <a class="linkbtn" href="${wvUrl(satState.layer,d2,b)}" target="_blank" rel="noopener noreferrer">${t("satOpen")}</a>
    </div>
    <p class="sat-note">${L.what[LANG]} ${t("satClouds")} ${t("satSrc")}</p>
  </div>`;
  const cmp=document.getElementById("cmp");
  cmp.querySelector("input").oninput=ev=>{cmp.style.setProperty("--cut",ev.target.value+"%");track("sat",c.i);};
  let failed=false;
  cmp.querySelectorAll("img").forEach(img=>img.onerror=()=>{if(failed)return;failed=true;
    const f=document.createElement("div");f.className="fail";
    f.innerHTML=`<div><b>${t("satFailT")}</b>${t("satFail")}<br><br><a href="${wvUrl(satState.layer,d2,b)}" target="_blank" rel="noopener noreferrer">${t("satOpen")}</a></div>`;
    cmp.appendChild(f);});
  el.querySelectorAll("[data-layer]").forEach(x=>x.onclick=()=>{satState.layer=x.dataset.layer;drawSat(c);track("sat",c.i);});
  const yr=(id,key)=>{document.getElementById(id).onchange=ev=>{const v=Math.max(2001,Math.min(2025,+ev.target.value||satState[key]));satState[key]=v;drawSat(c);track("sat",c.i);};};
  yr("y1","y1"); yr("y2","y2");
}

let SAMPLE=null, DL=null;
(async()=>{try{if(window.claude&&window.claude.use){[SAMPLE,DL]=await Promise.all([window.claude.use("sample"),window.claude.use("downloads")]);}}catch(e){}

const ALIAS={NL:["holanda","holland"],GB:["inglaterra","england","gran bretana","britain","escocia","scotland"],CZ:["chequia","czech"],TR:["turkiye"],
  US:["ee.uu","eeuu","usa","estados unidos","united states","america del norte"],DO:["rd","dominicana","dominican"],KR:["corea del sur","south korea"],KP:["corea del norte","north korea"],

function findCountry(q){
  const n=" "+norm(q).replace(/[¿?¡!.,;:]/g," ")+" ";
  const byName=COUNTRIES.filter(c=>n.includes(" "+norm(c.es)+" ")||n.includes(" "+norm(c.en)+" ")).sort((a,b)=>b.es.length-a.es.length)[0];
  if(byName)return byName;
  for(const [i,ws] of Object.entries(ALIAS)) if(ws.some(w=>n.includes(" "+w)))return COUNTRIES.find(c=>c.i===i)||null;
  return null;
}
function profileData(c){const e=DATA[c.i];return {country:c[LANG],code:c.i,region:CONT[c.c][LANG],agency:e.inst,agency_links:e.urls,
  phenomenon_type:CATS[e.cat][LANG],what_is_changing:e.ph[LANG],research_question:e.q[LANG],analogy:CATS[e.cat].an[LANG],
  nasa_datasets:e.nasa.map(k=>({name:NASA[k].n,agency:NASA[k].o,measures:NASA[k][LANG],analogy:NASA[k].an[LANG]})),note:e.note?e.note[LANG]:null,
  statistical_analysis:"pending"};}
function localAnswer(q){
  const n=norm(q), c=findCountry(q)||exSel;
  const catHit=Object.entries({ice:["glaciar","hielo","nieve","glacier","ice","snow"],drought:["sequia","calor","drought","heat"],fire:["incendio","fuego","fire","wildfire","quemad"],
    flood:["inundacion","flood","lluvia","rain","huracan","ciclon","hurricane","cyclone"],coast:["costa","nivel del mar","coast","sea level","coral","sargazo","sargassum"],water:["lago","rio","embalse","lake","river","reservoir","agua subterranea","groundwater"],forest:["bosque","forest","vegetacion","vegetation","deforest","selva"]})
    .find(([k,ws])=>ws.some(w=>n.includes(w)));
  const mentioned=findCountry(q);
  if(/(sargaz|sargass)/.test(n)&&!mentioned){
    const L=COUNTRIES.filter(x=>DATA[x.i].nasa.includes("sargassum")).map(x=>x[LANG]);
    return LANG==="es"?`El sargazo es un alga flotante que llega en grandes cantidades a playas del Caribe. En la plataforma lo seguimos en: ${L.join(", ")}.\n\nSe detecta con el índice de algas flotantes (AFAI) calculado con imágenes MODIS y VIIRS.\n\n💡 ${NASA.sargassum.an.es}`
      :`Sargassum is a floating seaweed that reaches Caribbean beaches in huge amounts. On the platform we track it in: ${L.join(", ")}.\n\nIt is detected with the floating algae index (AFAI) computed from MODIS and VIIRS imagery.\n\n💡 ${NASA.sargassum.an.en}`;
  }
  if(catHit&&!mentioned){
    const L=COUNTRIES.filter(x=>DATA[x.i].cat===catHit[0]).map(x=>x[LANG]);
    return (LANG==="es"?`Países de la plataforma cuyo fenómeno principal es «${CATS[catHit[0]].es}» (${L.length}):\n${L.join(", ")}.\n\n💡 ${CATS[catHit[0]].an.es}`
      :`Platform countries whose main phenomenon is “${CATS[catHit[0]].en}” (${L.length}):\n${L.join(", ")}.\n\n💡 ${CATS[catHit[0]].an.en}`);
  }
  if(!c) return t("locNoCountry");
  const e=DATA[c.i], name=c[LANG];
  if(/(quien|institucion|fuente|agencia|servicio|who|agency|official|source)/.test(n))
    return !e.urls.length?(LANG==="es"?`En ${name}, la institución oficial es ${e.inst}.`:`In ${name}, the official agency is ${e.inst}.`):(LANG==="es"?`En ${name}, la fuente oficial es ${e.inst}${e.urls[0]?" ("+host(e.urls[0])+")":""}. Sus mediciones en tierra sirven para validar lo que ven los satélites de la NASA.`
      :`In ${name}, the official source is ${e.inst}${e.urls[0]?" ("+host(e.urls[0])+")":""}. Its ground measurements help validate what NASA satellites see.`);
  if(/(nasa|satelite|satellite|dato|data|medir|mide|measure|imagen|image)/.test(n))
    return (LANG==="es"?`Para investigar ${name} usamos:\n`:`To investigate ${name} we use:\n`)+
      e.nasa.map(k=>`• ${NASA[k].n}: ${NASA[k][LANG]}\n  💡 ${NASA[k].an[LANG]}`).join("\n");
  if(/(tendencia|significativ|estadistic|trend|significant|statistic|cuanto|how much|how far)/.test(n))
    return LANG==="es"?`La pregunta de investigación de ${name} es: «${e.q.es}».\n\nPara responder «cuánto» necesitamos la serie temporal procesada y la prueba de Mann-Kendall, que todavía está pendiente para este país. No damos cifras hasta tenerlas.\n\n💡 Mann-Kendall es como saber si un jugador realmente mejora: no basta un partido bueno, hay que ver si la mayoría de los partidos son mejores que los anteriores.`
      :`${name}’s research question is: “${e.q.en}”.\n\nTo answer “how much” we need the processed time series and the Mann-Kendall test, which is still pending for this country. We don’t give numbers until we have them.\n\n💡 Mann-Kendall is like checking whether a player is really improving: one good game isn’t enough, most games must beat the earlier ones.`;
  return (LANG==="es"?`En ${name}, el fenómeno principal es «${CATS[e.cat].es}»:\n`:`In ${name}, the main phenomenon is “${CATS[e.cat].en}”:\n`)+
    e.ph[LANG].map(x=>"• "+x).join("\n")+`\n\n💡 ${CATS[e.cat].an[LANG]}`;
}
async function ask(q){
  q=q.trim(); if(!q)return;
  const out=document.getElementById("answer");
  const c=findCountry(q);
  if(c&&c!==exSel){ if(c.c!==exCont){exSel=c;exCont=c.c;history.replaceState(null,"","#explorer-"+c.i.toLowerCase());renderExplorer();document.getElementById("askIn").value=q;return ask(q);}
    exSel=c;history.replaceState(null,"","#explorer-"+c.i.toLowerCase());updateRegion();drawList();drawProfile();track("visit",c.i);}
  track("ask");
  const sc=c||exSel;
  out.innerHTML=`<div class="answer"><div class="qq">${escapeHtml(q)}</div><div class="txt wait" id="atxt">${t("thinking")}</div><div class="by" id="aby"></div><div class="acts" id="aacts"></div></div>`;
  const txt=document.getElementById("atxt"), by=document.getElementById("aby");
  const finish=mode=>{txt.classList.remove("wait");by.innerHTML=`<span>${t(mode)}</span>${t("verify")}`;
    if(sc){document.getElementById("aacts").innerHTML=`<button class="mini-btn" id="goProf">${t("seeProf")} ${flag(sc.i)} ${sc[LANG]}</button>`;
      document.getElementById("goProf").onclick=()=>document.getElementById("profile").scrollIntoView({behavior:reduced?"auto":"smooth"});}};
  if(!SAMPLE){txt.textContent=localAnswer(q);finish("modeLocal");return;}
  if(askAbort)askAbort.abort(); askAbort=new AbortController();
  const catalog=COUNTRIES.map(x=>`${x.i}=${x[LANG]}(${DATA[x.i].cat})`).join(", ");
  const prompt=`You are the research assistant inside EARTH//TRACE, a NASA Space Apps 2026 platform that helps anyone investigate how the Earth is changing.
Answer in ${LANG==="es"?"Spanish":"English"}, for students, in at most 150 words. No markdown headings; short paragraphs or "• " bullets.
Rules:
- Ground the answer in the platform data (use the get_country tool for any country). You may add widely established Earth-science background, clearly marked as background.
- Never invent numbers, dates, measurements or trends. Statistical analysis (Mann-Kendall, Sen's slope) is still pending for every country: say so if asked "how much".
- Include one everyday analogy (start that line with "💡").
- When useful, name the NASA dataset that measures it and suggest the "Satellite view" comparison in the country profile.
- If the question is unrelated to Earth science, say so briefly and suggest a related question.
Platform countries (ISO=name(category)): ${catalog}
Currently selected country: ${sc?JSON.stringify(profileData(sc)):"none"}
Earlier turns: ${JSON.stringify(askHistory.slice(-3))}
Question: ${q}`;
  try{
    const res=await SAMPLE(prompt,{signal:askAbort.signal,cache:false,
      tools:[{name:"get_country",description:"Get the EARTH//TRACE profile of a platform country by ISO-2 code (e.g. DO, CH, BR).",
        inputSchema:{type:"object",properties:{code:{type:"string"}},required:["code"]},
        execute:({code})=>{const x=COUNTRIES.find(y=>y.i===String(code).toUpperCase());if(!x)throw new Error("Not on the platform");return profileData(x);}}],
      onText:({text})=>{txt.classList.remove("wait");txt.textContent=text;}});
    txt.textContent=res.text; askHistory.push({q,a:res.text.slice(0,400)}); finish("modeAI");
  }catch(err){
    if(err&&err.name==="AbortError")return;
    txt.textContent=localAnswer(q); finish("modeLocal");
    if(err&&err.code==="not_granted")SAMPLE=null;
  }
}
const escapeHtml=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function askChips(){
  const c=exSel, el=document.getElementById("chips"); if(!el)return;
  const qs=c?[DATA[c.i].q[LANG],t("cq3").replace("{c}",c[LANG]),t("cq2").replace("{c}",c[LANG]),t("cq1").replace("{c}",c[LANG])]:[t("gq1"),t("gq2"),t("gq3"),t("gq4")];
  el.innerHTML=qs.map(x=>`<button type="button">${escapeHtml(x)}</button>`).join("");

/* =========================================================
   ESTADÍSTICA COMPARTIDA · Mann-Kendall + pendiente de Sen
   ========================================================= */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const tt=1/(1+.3275911*x);
  return s*(1-(((((1.061405429*tt-1.453152027)*tt)+1.421413741)*tt-.284496736)*tt+.254829592)*tt*Math.exp(-x*x));}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
function mannKendall(y){
  const n=y.length; let S=0;
  for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++)S+=Math.sign(y[j]-y[i]);
  let tie=0; d3.rollup(y,v=>v.length,d=>d).forEach(k=>{if(k>1)tie+=k*(k-1)*(2*k+5);});
  const v=(n*(n-1)*(2*n+5)-tie)/18;
  const Z=v>0?(S>0?(S-1)/Math.sqrt(v):S<0?(S+1)/Math.sqrt(v):0):0;
  return {S,Z,p:2*(1-Phi(Math.abs(Z)))};
}
function senSlope(x,y){const s=[];for(let i=0;i<x.length-1;i++)for(let j=i+1;j<x.length;j++)if(x[j]!==x[i])s.push((y[j]-y[i])/(x[j]-x[i]));
  const slope=d3.median(s)||0;return {slope,intercept:d3.median(y.map((v,i)=>v-slope*x[i]))};}
function analyze(years,values,anomaly){
  const mk=mannKendall(values), sen=senSlope(years,values), span=years[years.length-1]-years[0];
  const total=sen.slope*span, base=sen.intercept+sen.slope*years[0];
  const pct=!anomaly&&Math.abs(base)>1e-9?100*total/Math.abs(base):null;
  const level=mk.p<.01?"g2":mk.p<.05?"g":mk.p<.1?"y":"r";
  return {...mk,...sen,total,pct,level,dir:sen.slope>0?"up":"down",n:values.length};
}
const fmtN=(v,d=0)=>(+v).toLocaleString(LANG==="es"?"es-DO":"en-US",{maximumFractionDigits:d,minimumFractionDigits:d});
const fmtP=p=>p<.001?"< 0.001":fmtN(p,3);
const dec=v=>Math.abs(v)<1?3:Math.abs(v)<10?2:Math.abs(v)<100?1:0;
function lineChart(el,{years,values,unit,color="var(--primary)",trend,cursor,height=240,compact,label}){
  const W=560,H=height,m={t:18,r:14,b:28,l:compact?46:60};
  const x=d3.scaleLinear().domain(d3.extent(years)).range([m.l,W-m.r]);
  const y=d3.scaleLinear().domain(d3.extent(values)).nice().range([H-m.b,m.t]);
  const svg=d3.select(el).html("").append("svg").attr("viewBox",`0 0 ${W} ${H}`).attr("role","img").attr("class","chart-svg")
    .attr("aria-label",`${label||unit||""} ${years[0]}–${years[years.length-1]}`);
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(compact?4:7).tickFormat(d3.format("d")));
  svg.append("g").attr("class","axis").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(v=>fmtN(v,dec(v))));
  if(unit)svg.append("text").attr("x",m.l).attr("y",11).attr("class","axlab").text(unit);
  const pts=years.map((yr,i)=>[yr,values[i]]);
  svg.append("path").datum(pts).attr("class","ln").attr("stroke",color).attr("d",d3.line().x(d=>x(d[0])).y(d=>y(d[1])));
  svg.append("g").selectAll("circle").data(pts).join("circle").attr("class","dot").attr("fill",color).attr("r",compact?2.5:3.5).attr("cx",d=>x(d[0])).attr("cy",d=>y(d[1]))
    .append("title").text(d=>`${d[0]}: ${fmtN(d[1],dec(d[1]))} ${unit||""}`);
  if(trend){const a=years[0],b=years[years.length-1];
    svg.append("line").attr("class","trend").attr("x1",x(a)).attr("x2",x(b)).attr("y1",y(trend.intercept+trend.slope*a)).attr("y2",y(trend.intercept+trend.slope*b));}
  const cur=cursor?svg.append("line").attr("class","cursor").attr("y1",m.t).attr("y2",H-m.b):null;
  return {setCursor:yr=>{if(cur)cur.attr("x1",x(yr)).attr("x2",x(yr));}};
}
let actx=null;
function sonify(values){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const [lo,hi]=d3.extent(values),f=d3.scaleLinear().domain([lo,hi===lo?lo+1:hi]).range([220,880]),now=actx.currentTime,st=.16;
  values.forEach((v,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f(v);
    g.gain.setValueAtTime(0,now+i*st);g.gain.linearRampToValueAtTime(.16,now+i*st+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*st+st*.95);
    o.connect(g).connect(actx.destination);o.start(now+i*st);o.stop(now+i*st+st);});}catch(e){}}

];
let LAB={A:null,B:null,from:null,to:null};
function parseSeries(text){
  const rows=[];
  for(const line of text.split(/\r?\n/)){
    const cells=line.split(/[,;\t]/).map(s=>s.trim().replace(/^"|"$/g,""));
    if(cells.length<2)continue;
    const tcell=cells[0], val=cells.slice(1).map(Number).find(v=>isFinite(v)&&cells.slice(1).some(s=>s!==""));
    let year=null,frac=0;
    if(/^\d{4}$/.test(tcell))year=+tcell;
    else{const m=tcell.match(/^(\d{4})-(\d{2})/);if(m){year=+m[1];frac=1;}}
    const v=cells.slice(1).map(s=>s===""?NaN:Number(s)).find(isFinite);
    if(year&&isFinite(v)&&v>-9000)rows.push({year,v,frac});
  }
  if(rows.length<3)return null;
  const monthly=rows.some(r=>r.frac);
  const g=d3.rollups(rows,a=>d3.mean(a,r=>r.v),r=>r.year).sort((a,b)=>a[0]-b[0]);
  return {years:g.map(d=>d[0]),values:g.map(d=>d[1]),monthly,raw:rows.length};
}

function dxLake(el){
  dxFrame(el,"lake",`<svg id="lk" viewBox="0 0 400 260" role="img" aria-label="${t("dx_lake")}"></svg>
    <label class="lbl2">🌧 ${t("lkIn")} <b id="vIn"></b></label><input type="range" id="sIn" min="0" max="100" value="50">
    <label class="lbl2">☀ ${t("lkOut")} <b id="vOut"></b></label><input type="range" id="sOut" min="0" max="100" value="50">
    <button class="btn lime" id="lkRun">▶ ${t("lkRun")}</button><div class="chart" id="lkch"></div>`);
  const svg=d3.select("#lk"); svg.append("rect").attr("width",400).attr("height",260).attr("class","eu-c");
  const lake=svg.append("ellipse").attr("cx",200).attr("cy",130).attr("class","lake");
  const yrT=svg.append("text").attr("x",14).attr("y",28).attr("class","lk-y");
  const set=v=>lake.attr("rx",Math.max(0,170*Math.sqrt(v))).attr("ry",Math.max(0,95*Math.sqrt(v)));
  let vol=.6; set(vol);
  const lab=()=>{document.getElementById("vIn").textContent=document.getElementById("sIn").value;document.getElementById("vOut").textContent=document.getElementById("sOut").value;};
  ["sIn","sOut"].forEach(i=>document.getElementById(i).oninput=lab); lab();
  document.getElementById("lkRun").onclick=()=>{
    const inn=+document.getElementById("sIn").value/100, out=+document.getElementById("sOut").value/100;
    const ys=[],vs=[]; let v=.6; for(let y=0;y<=20;y++){ys.push(2005+y);vs.push(+(v*100).toFixed(1));v=Math.max(0,Math.min(1,v+(inn-out)*.05+(Math.sin(y*1.7)*.015)));}
    let i=0; const step=()=>{set(vs[i]/100);yrT.text(ys[i]);if(++i<ys.length)setTimeout(step,reduced?0:110);else{
      lineChart(document.getElementById("lkch"),{years:ys,values:vs,unit:"%",trend:analyze(ys,vs),compact:true,height:180});
      const r=analyze(ys,vs);document.getElementById("dxx").innerHTML=`<div class="feedback ${r.dir==="up"?"good":"bad"}">${r.p<.05?(r.dir==="up"?t("lkUp"):t("lkDown")):t("lkFlat")}<span>${t("lkReal")}</span></div>`;discDone("lake");}};step();};
}

    beam.transition().duration(reduced?0:700).attr("x1",200-gap+22).attr("x2",200+gap-22).attr("y1",62+dip);dist.text(`${t("grDist")}: ${fmtN(220+gap*.2,1)} km`);};

function dxNdvi(el){
  dxFrame(el,"ndvi",`<div class="leaf" id="leaf" aria-hidden="true">🌿</div><div class="ndvi" id="nd"></div>
    <label class="lbl2">🔴 ${t("ndRed")} <b id="vR"></b></label><input type="range" id="sR" min="2" max="60" value="8">
    <label class="lbl2">🟣 ${t("ndNir")} <b id="vN"></b></label><input type="range" id="sN" min="2" max="60" value="50">
    <div class="linkrow"><button class="mini-btn" data-p="forest">🌳 ${t("ndF")}</button><button class="mini-btn" data-p="crop">🌾 ${t("ndC")}</button><button class="mini-btn" data-p="desert">🏜 ${t("ndD")}</button><button class="mini-btn" data-p="water">💧 ${t("ndW")}</button></div>`);
  let moved=0;
  const P={forest:[5,50],crop:[10,35],desert:[30,35],water:[6,3]};
  const up=()=>{const r=+document.getElementById("sR").value/100,n=+document.getElementById("sN").value/100,v=(n-r)/(n+r);
    document.getElementById("vR").textContent=fmtN(r,2);document.getElementById("vN").textContent=fmtN(n,2);
    const col=d3.interpolateRgbBasis(["#4FC3F7","#C8B88A","#C5E384","#1B5E3B"])((v+1)/2);
    document.getElementById("leaf").style.background=col;
    document.getElementById("nd").innerHTML=`NDVI = (${fmtN(n,2)} − ${fmtN(r,2)}) / (${fmtN(n,2)} + ${fmtN(r,2)}) = <b>${fmtN(v,2)}</b><span>${v>.6?t("ndHigh"):v>.2?t("ndMid"):v>0?t("ndLow"):t("ndNeg")}</span>`;
    if(++moved>4)discDone("ndvi");};
  ["sR","sN"].forEach(i=>document.getElementById(i).oninput=up);
  el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const [r,n]=P[b.dataset.p];document.getElementById("sR").value=r;document.getElementById("sN").value=n;up();});

}
let NZ={round:0,score:0,seed:Date.now(),pick:null};
function rngS(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function dxNoise(el){
  if(NZ.round>=5){dxFrame(el,"noise",`<p class="score">${t("nzScore")}: ${NZ.score}/5</p><button class="btn lime" id="nzA">${t("again")}</button>`);
    document.getElementById("nzA").onclick=()=>{NZ={round:0,score:0,seed:Date.now(),pick:null};renderDiscovery();};discDone("noise");return;}
  const r=rngS(NZ.seed+NZ.round*7919), ys=yrs(2001,2020), sl=[1.1,.8,.6,.45,.35][NZ.round]*(r()<.5?-1:1);
  const T=ys.map((y,i)=>50+sl*i+gauss(r)*4), N=ys.map(()=>50+gauss(r)*4), left=r()<.5, A=left?T:N, B=left?N:T, ans=left?"A":"B";
  dxFrame(el,"noise",`<p class="score">${t("round")} ${NZ.round+1}/5 · ${NZ.score} ✓</p><p>${t("nzPick")}</p>
    <div class="duo"><button data-p="A" class="${NZ.pick?(ans==="A"?"right":NZ.pick==="A"?"wrong":""):""}"><b>A</b><div class="chart" id="nA"></div></button>
    <button data-p="B" class="${NZ.pick?(ans==="B"?"right":NZ.pick==="B"?"wrong":""):""}"><b>B</b><div class="chart" id="nB"></div></button></div><div id="nzF"></div>`);
  lineChart(document.getElementById("nA"),{years:ys,values:A,compact:true,height:170,trend:NZ.pick?senSlope(ys,A):null});
  lineChart(document.getElementById("nB"),{years:ys,values:B,compact:true,height:170,trend:NZ.pick?senSlope(ys,B):null});
  if(!NZ.pick)el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{NZ.pick=b.dataset.p;if(NZ.pick===ans)NZ.score++;dxNoise(el);});
  else{document.getElementById("nzF").innerHTML=`<div class="feedback ${NZ.pick===ans?"good":"bad"}">${NZ.pick===ans?t("tGood"):t("tBad")}<span>p(A) = ${fmtP(mannKendall(A).p)} · p(B) = ${fmtP(mannKendall(B).p)}</span></div><button class="btn lime" id="nzN">${t("next")}</button>`;
    document.getElementById("nzN").onclick=()=>{NZ.round++;NZ.pick=null;dxNoise(el);};}
}

 ["p-value","Valor p","The probability of seeing a pattern this strong by pure chance. Below 0.05 we call it significant.","La probabilidad de ver un patrón así de fuerte por pura casualidad. Por debajo de 0,05 lo llamamos significativo."],
 ["Mann-Kendall test","Prueba de Mann-Kendall","Checks whether most later values are higher (or lower) than earlier ones.","Comprueba si la mayoría de los valores posteriores son mayores (o menores) que los anteriores."],
 ["Sen’s slope","Pendiente de Sen","The typical change per year, ignoring outliers.","El cambio típico por año, sin dejarse llevar por valores extremos."],

 ["NDVI","NDVI","A vegetation index from −1 to 1. Higher means greener, healthier plants.","Un índice de vegetación de −1 a 1. Más alto significa plantas más verdes y sanas."],
 ["GRACE / GRACE-FO","GRACE / GRACE-FO","Twin satellites that weigh water and ice through gravity.","Satélites gemelos que pesan el agua y el hielo a través de la gravedad."],
 ["Time series","Serie de tiempo","The same measurement repeated over time, for example once a year.","La misma medición repetida en el tiempo, por ejemplo una vez al año."],
 ["Gt (gigatonne)","Gt (gigatonelada)","One billion metric tonnes, roughly one cubic kilometer of water.","Mil millones de toneladas, aproximadamente un kilómetro cúbico de agua."]

function renderGuide(){
  const L=LANG, g=k=>k[L];
  main.innerHTML=`
  <section class="page-head"><div class="wrap"><span class="n">📘 ${t("guideZone")}</span><h1>${t("guideT")}</h1><p>${t("guideLede")}</p>
    <div class="cta" style="margin-top:18px"><a class="btn lime" href="#explorer">${t("guideGo")}</a><button class="btn line" id="tourBtn">${t("guideTour")}</button></div></div></section>
  <section class="block" style="padding-top:clamp(24px,4vw,40px)"><div class="wrap guide">
    <nav class="toc" aria-label="${t("guideToc")}"><b>${t("guideToc")}</b>${GUIDE.map(s=>`<a href="#guide" data-to="g-${s.id}">${s.ico} ${g(s.t)}</a>`).join("")}
      <a href="#guide" data-to="g-gloss">📖 ${t("glossT")}</a><a href="#guide" data-to="g-faq">❓ ${t("faqT")}</a></nav>
    <div class="gbody">
      ${GUIDE.map(s=>`<article class="gsec" id="g-${s.id}"><h2><span aria-hidden="true">${s.ico}</span> ${g(s.t)}</h2><p class="intro">${g(s.p)}</p>
        <ol class="gsteps">${s.s[L].map(x=>`<li>${x}</li>`).join("")}</ol></article>`).join("")}
      <article class="gsec" id="g-gloss"><h2>📖 ${t("glossT")}</h2><dl class="gloss">${GLOSS.map(r=>`<div><dt>${L==="en"?r[0]:r[1]}</dt><dd>${L==="en"?r[2]:r[3]}</dd></div>`).join("")}</dl></article>
      <article class="gsec" id="g-faq"><h2>❓ ${t("faqT")}</h2>${FAQ.map(f=>`<details class="faq"><summary>${g(f[0])}</summary><p>${g(f[1])}</p></details>`).join("")}</article>
    </div></div></section>`;
  main.querySelectorAll("[data-to]").forEach(a=>a.onclick=ev=>{ev.preventDefault();document.getElementById(a.dataset.to).scrollIntoView({behavior:reduced?"auto":"smooth"});});
  document.getElementById("tourBtn").onclick=()=>showWelcome(true);
}
function showWelcome(force){
  let seen=false; try{seen=localStorage.getItem("earthtrace-welcome")==="1";}catch(e){}
  if(seen&&!force)return;
  const d=document.createElement("dialog"); d.className="welcome"; d.setAttribute("aria-labelledby","wT");
  d.innerHTML=`<h2 id="wT">${t("wT")}</h2><p>${t("wS")}</p>
    <ol class="wsteps"><li><span>🌍</span><b>${t("w1")}</b><small>${t("w1d")}</small></li><li><span>🕵</span><b>${t("w2")}</b><small>${t("w2d")}</small></li><li><span>📊</span><b>${t("w3")}</b><small>${t("w3d")}</small></li></ol>
    <div class="cta"><a class="btn lime" href="#explorer" data-close>${t("wGo")}</a><a class="btn ghost-d" href="#guide" data-close>${t("wGuide")}</a></div>`;
  document.body.appendChild(d);
  const close=()=>{try{localStorage.setItem("earthtrace-welcome","1");}catch(e){}d.close();d.remove();};
  d.querySelectorAll("[data-close]").forEach(a=>a.addEventListener("click",close));
  d.addEventListener("cancel",close);
  if(d.showModal)d.showModal(); else d.setAttribute("open","");
}

/* =========================================================
   PÁGINAS DE SECCIÓN (se construyen en las siguientes partes)
   ========================================================= */
function renderSection(s){
  main.innerHTML=`
  <section class="page-head"><div class="wrap">
    <span class="n">${s.n}</span>
    <h1>${s.en}</h1>
    <p>${s.d[LANG]}</p>
  </div></section>
  <section class="block"><div class="wrap">
    <div class="locked"><span aria-hidden="true">🔒</span><div><b>${t("lockT")}</b>${t("lockS")}</div></div>
    <div class="plan">
      <div><h3>${t("what")}</h3><ul>${s.plan[LANG].map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div><h3>${t("how")}</h3><p>${t("howTxt")[s.id]}</p><a class="btn solid" href="#">${t("back")}</a></div>
    </div>
  </div></section>`;
}

/* =========================================================
   CONTROLES
   ========================================================= */
document.getElementById("langBtn").onclick=()=>{LANG=LANG==="es"?"en":"es";try{localStorage.setItem("earthtrace-lang",LANG);}catch(e){}render();};
document.getElementById("themeBtn").onclick=()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark";
};
render();
setTimeout(()=>showWelcome(false),600);
</script>
